[package]
name = "unity-font-kit"
version = "0.1.4"
edition = "2024"
rust-version = "1.98"
description = "Find, check and rebuild fonts in Unity games"
license = "MIT"
repository = "https://github.com/idrmn/unity-font-kit"

[[bin]]
name = "ufk"
path = "src/main.rs"

[lints.rust]
unsafe_code = "deny"

[dependencies]
anyhow = "1.0.104"
rabex = { version = "0.2.1", features = ["compression-lz4hc"] }
unity-typetree-gen = "0.3.2"
freetype-sys = "0.23.0"
skrifa = "0.48.0"
unicode-general-category = "1.1.0"
indexmap = "2.14.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
kiddo = "5.3.3"
sha1 = "0.11.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
dunce = "1.0.5"
ureq = "3.4.2"
png = "0.18.1"
unicode_names2 = "4.0.0"
flate2 = "1.1.10"
tar = "0.4.46"
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2"] }
crc32fast = "1.5.2"
freya = { version = "0.4.3", features = ["zoom-shortcuts"] }
rfd = "0.17"
blocking = "1.7"
bytes = "1"
base64 = "0.23.1"
async-channel = "2.5.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
dirs = "7.0.0"
write-fonts = "0.54.1"
kurbo = "0.13"

[patch.crates-io]
# Local fixes: write m_RefTypes (Unity 6 globalgamemanagers.assets); read maps as lists of pairs.
rabex = { path = "vendor/rabex" }
# FreeType 2.13.2 from release sources, built statically (see vendor/freetype-sys/Cargo.toml).
freetype-sys = { path = "vendor/freetype-sys" }

[dev-dependencies]
freya-testing = "0.4.3"
