[package]
edition = "2024"
name = "rabex"
version = "0.2.1"
authors = [
    "Rudolf Kolbe <rkolbe96@gmail.com>",
    "Jakob Hellermann <jakobhellermann@protonmail.com>",
]
build = false
include = [
    "src/*",
    "examples/*",
    "resources/lz4.tpk",
    "Cargo.toml",
    "README.md",
    "LICENSE-APACHE.md",
    "LICENSE-MIT.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Tools for parsing and writing unity files, bundles and typetrees"
documentation = "https://docs.rs/rabex"
readme = "README.md"
keywords = [
    "unity",
    "typetree",
    "assetbundle",
    "serializedfile",
    "serde",
]
categories = [
    "game-development",
    "parser-implementations",
    "encoding",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jakobhellermann/RustyAssetBundleEXtractor"

[features]
compression-all = [
    "compression-lzma",
    "compression-lz4",
    "compression-lz4hc",
]
compression-lz4 = ["dep:lz4_flex"]
compression-lz4hc = ["dep:lz4"]
compression-lzma = ["dep:lzma-rs"]
default = [
    "embed-tpk",
    "compression-lzma",
    "compression-lz4",
]
embed-tpk = ["compression-lz4"]
serde_path_to_error = ["dep:serde_path_to_error"]
tpk-compression-brotli = ["dep:brotli"]
